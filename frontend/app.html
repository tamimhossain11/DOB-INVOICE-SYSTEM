<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invoice System — Dreams of Bangladesh</title>
<link rel="icon" href="/assets/dob-logo.png">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>

<div class="shell">
  <aside class="sidebar">
    <div class="sidebar-head">
      <img class="sidebar-logo" src="/assets/dob-logo.png" alt="Dreams of Bangladesh">
    </div>

    <nav class="nav" id="nav">
      <a href="#/dashboard"  data-route="dashboard"><span class="ico">◈</span> Dashboard</a>
      <a href="#/invoices"   data-route="invoices"><span class="ico">▤</span> Invoices</a>
      <a href="#/invoice/new" data-route="invoice-new"><span class="ico">＋</span> New invoice</a>
      <a href="#/clients"    data-route="clients"><span class="ico">◍</span> Clients</a>
      <a href="#/programmes" data-route="programmes"><span class="ico">◎</span> Programmes</a>
      <a href="#/settings"   data-route="settings"><span class="ico">⚙</span> Settings</a>
    </nav>

    <div class="sidebar-foot">
      <div class="who" id="who"></div>
      <button class="btn btn-sm btn-block" id="logout">Sign out</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1 id="page-title">Dashboard</h1>
        <div class="sub" id="page-sub"></div>
      </div>
      <div class="row" id="page-actions"></div>
    </header>
    <div class="content" id="view"></div>
  </main>
</div>

<div class="toasts" id="toasts"></div>
<div id="modal-root"></div>

<script src="/js/app.js"></script>

</body>
</html>
